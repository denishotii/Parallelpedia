<svg width="180" height="50" viewBox="0 0 180 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ICON -->
  <g transform="translate(0,3)">
    <!-- soft background -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#EFF4FF"/>
    <!-- back page -->
    <rect x="11" y="9" width="20" height="24" rx="4" fill="#DBEAFE"/>
    <!-- front page -->
    <rect x="15" y="7" width="20" height="24" rx="4" fill="#2563EB"/>
    <!-- parallel lines on page -->
    <rect x="19" y="12" width="12" height="2.4" rx="1.2" fill="white" opacity="0.95"/>
    <rect x="19" y="17" width="9" height="2.4" rx="1.2" fill="white" opacity="0.9"/>
    <rect x="19" y="22" width="7" height="2.4" rx="1.2" fill="white" opacity="0.85"/>
    <!-- small node / DKG dot -->
    <circle cx="34" cy="30" r="3.2" fill="#22C55E"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(52,14)">
    <!-- Light background highlight for text only -->
    <rect x="-4" y="2" width="140" height="26" rx="6" fill="#FFFFFF" opacity="0.17"/>
    <text x="0" y="22"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22"
          font-weight="700"
          letter-spacing="-0.02em"
          fill="#0F172A">
      Parallel
    </text>
    <text x="75" y="22"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22"
          font-weight="500"
          letter-spacing="-0.02em"
          fill="#64748B">
      pedia
    </text>
  </g>
</svg>
