<svg width="260" height="60" viewBox="0 0 260 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ICON -->
  <g transform="translate(6,8)">
    <!-- soft background -->
    <rect x="0" y="0" width="44" height="44" rx="14" fill="#EFF4FF"/>
    <!-- back page -->
    <rect x="11" y="9" width="20" height="24" rx="4" fill="#DBEAFE"/>
    <!-- front page -->
    <rect x="15" y="7" width="20" height="24" rx="4" fill="#2563EB"/>
    <!-- parallel lines on page -->
    <rect x="19" y="12" width="12" height="2.4" rx="1.2" fill="white" opacity="0.95"/>
    <rect x="19" y="17" width="9" height="2.4" rx="1.2" fill="white" opacity="0.9"/>
    <rect x="19" y="22" width="7" height="2.4" rx="1.2" fill="white" opacity="0.85"/>

    <!-- small node / DKG dot -->
    <circle cx="34" cy="30" r="3.2" fill="#22C55E"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(64,18)">
    <!-- "Parallel" -->
    <text x="0" y="18"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20"
          font-weight="700"
          letter-spacing="0.02em"
          fill="#0F172A">
      Parallel
    </text>
    <!-- "pedia" (nudged closer) -->
    <text x="86" y="18"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20"
          font-weight="500"
          letter-spacing="0.02em"
          fill="#64748B">
      pedia
    </text>
  </g>
</svg>
